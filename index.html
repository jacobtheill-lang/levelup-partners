<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#1f7a6c" />
    <!-- Samme ikon som skaerm-app/landingssiden, så fanebladet matcher

         favicon-cache — sæt tallet op igen, hvis ikonet skiftes senere. -->

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=3" />
    <title>LevelUp — Partner-portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Kun til logo-wordmarket i topbaren (App.tsx), så det matcher landingssidens
         "LevelUp"-logo — resten af portalen bruger sit eget skrifttype-system (tokens.css). -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
